onboarding = false

[theme]
name = "gruvbox"

auto_switch = false

[ui]
show_agent_labels_on_pane_borders = false

agent_panel_sort = "priority"

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent", "$ask", "$ask_count"], ["$task", "$task_count"]]
[ui.sound]
enabled = false

[keys]
prefix = "ctrl+b"
goto = "prefix+g"
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
focus_pane_left = "prefix+h"
navigate_workspace_down = "j"
navigate_pane_down = "ctrl+j"
split_horizontal = "prefix+minus"
switch_workspace = "alt+1..9"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "vantuh.my-usage.show"
description = "show codex/kiro/cursor usage"

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = false

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"
