# Pre-commit hooks configuration
# Install once per clone:  pre-commit install
# Then hooks run automatically on every `git commit`.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        # Scans staged changes for hardcoded secrets.
        # Entry (from official .pre-commit-hooks.yaml):
        #   gitleaks git --pre-commit --redact --staged --verbose
